services:
  gold-tracker-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold-tracker-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_NAME=gold_tracker
      - DB_USER=gold_admin
      - DB_PASSWORD=${GOLD_DB_PASS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3065:3000"

  gold-tracker-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gold-tracker-ui
    restart: unless-stopped
    ports:
      - "3960:80"

