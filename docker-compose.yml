services:
  db:
    image: postgres:16-alpine
    container_name: gold-tracker-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gold_tracker
      - POSTGRES_USER=gold_admin
      - POSTGRES_PASSWORD=gold_pass
    volumes:
      - gold_db_data:/var/lib/postgresql/data
    networks:
      - gold-network

  api:
    image: ghcr.io/theinfamoustoto/gold-tracker-api:latest
    container_name: gold-tracker-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=gold_tracker
      - DB_USER=gold_admin
      - DB_PASSWORD=gold_pass
      # Required. The API refuses every request until this is set, rather
      # than falling open on a misconfigured deploy.
      - GOLD_AUTH_USERNAME=${GOLD_AUTH_USERNAME:?set GOLD_AUTH_USERNAME in .env — nobody can sign in without it}
      - GOLD_AUTH_PASSWORD=${GOLD_AUTH_PASSWORD:?set GOLD_AUTH_PASSWORD in .env — nobody can sign in without it}
      - GOLD_SESSION_TTL_HOURS=${GOLD_SESSION_TTL_HOURS:-168}
      - GOLD_SESSION_SECRET=${GOLD_SESSION_SECRET:-}
      - GOLD_API_TOKEN=${GOLD_API_TOKEN:-}
      # Only needed if something other than the bundled UI calls the API
      # from a browser. Same-origin requests need no CORS header at all.
      - GOLD_ALLOWED_ORIGIN=${GOLD_ALLOWED_ORIGIN:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - AI_MODEL=${AI_MODEL:-claude-opus-5}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-180}
      - AI_AUTO_MIN_HOURS=${AI_AUTO_MIN_HOURS:-24}
    volumes:
      # Persist the CLI's credential cache across restarts.
      - gold_claude_config:/app/.claude
    depends_on:
      - db
    networks:
      - gold-network

  ui:
    image: ghcr.io/theinfamoustoto/gold-tracker-ui:latest
    container_name: gold-tracker-ui
    restart: unless-stopped
    ports:
      - "3960:80"
    depends_on:
      - api
    networks:
      - gold-network

networks:
  gold-network:
    driver: bridge

volumes:
  gold_db_data:
  gold_claude_config:
