name: Test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gold_test
          POSTGRES_PASSWORD: gold_test
          POSTGRES_DB: gold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gold_test -d gold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOLD_TEST_DATABASE_URL: postgres://gold_test:gold_test@localhost:5432/gold_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go unit and PostgreSQL integration tests
        working-directory: backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
